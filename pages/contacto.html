    <main>
      <!-- INTRODUCCIÓN -->

      <section class="introduccion-contacto">
        <h1>Contactate con nosotros</h1>

        <p>
          ¿Querés conocer más sobre nuestro proyecto? Escribinos y ponete en
          contacto con La Base.
        </p>
      </section>

      <!-- REDES -->

      <section class="redes" aria-label="Redes sociales">
        <h2>Encontranos</h2>

        <ul>
          <li>
            <a href="https://www.instagram.com/labase.cansat/" aria-label="Instagram de La Base" title="Instagram" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="6" r="1.2"/></svg>
            </a>
          </li>
          <li>
            <a href="https://www.youtube.com/@LaBase-CanSat" aria-label="Canal de YouTube de La Base" title="YouTube" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.6 3.6 12 3.6 12 3.6s-7.6 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.8.5 9.4.5 9.4.5s7.6 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>

          </li>
          <li>
            <a href="https://github.com/idel-bit/La-Base-CanSat" aria-label="Repositorio de La Base en GitHub" title="GitHub" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .9a11.1 11.1 0 0 0-3.5 21.6c.6.1.8-.3.8-.6v-2.1c-3.1.7-3.8-1.3-3.8-1.3-.5-1.3-1.2-1.6-1.2-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.1 1.7 1.1 1 .1.8 2.2 3.6 1.6.1-.8.4-1.3.7-1.6-2.5-.3-5.1-1.3-5.1-5.5 0-1.2.4-2.1 1.1-2.9-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 3 1.1a10.5 10.5 0 0 1 5.5 0c2.1-1.4 3-1.1 3-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.7 1.1 2.9 0 4.2-2.6 5.2-5.1 5.5.4.3.8 1 .8 2v3c0 .3.2.7.8.6A11.1 11.1 0 0 0 12 .9Z"/></svg>

      <!-- FORMULARIO -->

      <section
        class="formulario-contacto"
        data-aos="zoom-in"
        data-aos-duration="500"
      >
        <h2>Escribinos</h2>

        <form action="https://formspree.io/f/myezblza" method="post">
          <div>
            <label for="nombre"> Nombre </label>

            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Tu nombre"
              required
            />
          </div>

          <div>
            <label for="email"> Correo electrónico </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="tu@email.com"
              required
            />
          </div>

          <div>
            <label for="asunto"> Asunto </label>

            <input
              type="text"
              id="asunto"
              name="asunto"
              placeholder="¿Sobre qué querés escribirnos?"
              required
            />
          </div>

          <div>
            <label for="mensaje"> Mensaje </label>

            <textarea
              id="mensaje"
              name="mensaje"
              rows="6"
              placeholder="Escribí tu mensaje..."
              required
            ></textarea>
          </div>

          <button type="submit">Enviar mensaje</button>
        </form>
      </section>
    </main>
